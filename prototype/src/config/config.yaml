project:
  name: defect_prediction_prototype
  random_seed: 42

data:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  splits_dir: data/splits
  selection:
    primary_files:
      - data/raw/Promise + BPD/jm1.csv
      - data/raw/Promise + BPD/kc1.csv
      - data/raw/Promise + BPD/cm1.csv
      - data/raw/Promise + BPD/pc1.csv
    primary_datasets:
      - jm1
      - kc1
      - cm1
      - pc1
    supplementary:
      - eq
      - jdt
      - lc
      - ml
      - pde
      - ar1
      - ar3
      - ar4
      - ar5
      - ar6
    excluded:
      - kc2
      - mw1
      - pc3
      - pc4
      - apache
      - safe
      - zxing

features:
  metrics:
    - loc
    - v(g)
    - ev(g)
    - iv(g)
    - branchCount
  metrics_by_dataset:
    openstack:
      - la
      - ld
      - nf
      - nd
      - ns
      - ent
      - nrev
      - rtime
      - hcmt
      - self
      - ndev
      - age
      - nuc
      - app
      - aexp
      - rexp
      - arexp
      - rrexp
      - asexp
      - rsexp
      - asawr
      - rsawr
    qt:
      - la
      - ld
      - nf
      - nd
      - ns
      - ent
      - nrev
      - rtime
      - hcmt
      - self
      - ndev
      - age
      - nuc
      - app
      - aexp
      - rexp
      - arexp
      - rrexp
      - asexp
      - rsexp
      - asawr
      - rsawr
    jitfine:
      - la
      - ld
      - nf
      - ns
      - nd
      - entropy
      - ndev
      - lt
      - nuc
      - age
      - exp
      - rexp
      - sexp
  text:
    tfidf_max_features: 1000
  hybrid:
    datasets:
      - ghpr
      - openstack
      - qt
      - jitfine
    final_selection_excluded:
      - ghpr
    use_native_split:
      openstack: true
      qt: true
      jitfine: true

models:
  candidates:
    - rf
    - xgb
    - lgbm

training:
  cv_folds: 5

evaluation:
  selection_policy: hybrid_validation_then_tuned
  significance:
    bootstrap_iters: 300
    permutation_iters: 300

split:
  test_size: 0.2
  stratify: true

explainability:
  mode: true_shap
  background_sample_size: 100
  explain_sample_size: 50
  enable_plots: true
  allow_fallback: true
